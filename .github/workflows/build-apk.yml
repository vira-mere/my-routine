name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Build web app
      run: npm run build

    - name: Add Capacitor Android Platform
      run: npx cap add android --web-dir=dist || true

    - name: Sync Capacitor with Android
      run: npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Android Debug APK
      run: cd android && ./gradlew assembleDebug

    - name: Rename APK to My-Routine.apk
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk My-Routine.apk

    - name: Upload My-Routine.apk as artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Routine-APK
        path: My-Routine.apk
        retention-days: 30
